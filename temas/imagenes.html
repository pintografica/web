<!doctype html>
<html lang="es">
    <head>
        <!-- Juego de caracteres de casi todos los idiomas humanos (incluidos ñ, tildes ...) -->
        <meta charset="utf-8" />
        <!-- Escala inicial y renderizado _responsive_ por el ancho del dispositivo -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Compatibilidad con Microsoft Explorer -->
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <!-- Indéxame NO y sígueme NO -->
        <meta name="robots" content="noIndex, noFollow" />
        <!-- Breve descripción del sitio que se verá en los resultados de búsqueda -->
        <meta name="description" content="Sitio web de prueba elaborado en el curso de Confección y Publicación de Páginas Web (IFCD0110). Unidad Formativa UF1303, Elaboración de hojas de estilos" />
        <!-- Ruta al favicon -->
        <link rel="icon" type="image/svg+xml" href="assets/svg/logo-pintografica-flavicon.svg" />
        <!-- Utilícese una hoja de estilos Normalize -->
        <link rel="stylesheet" href="https://necolas.github.io/normalize.css/latest/normalize.css" />

        <!-- Tipografía -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Titan+One&display=swap" rel="stylesheet" />

        <!-- Ruta a las hojas de estilos -->
        <link rel="stylesheet" href="../assets/css/visibilidad.css" />
        <link rel="stylesheet" href="../assets/css/hover.css" />
        <link rel="stylesheet" href="../assets/css/transicions.css" />
        <link rel="stylesheet" href="../assets/css/carrousel.css" />
        <link rel="stylesheet" href="../assets/css/tipografia.css" />
        <link rel="stylesheet" href="../assets/css/menu.css" />
        <link rel="stylesheet" href="../assets/css/variables.css" />
        <link rel="stylesheet" href="../assets/css/logo.css" />
        <link rel="stylesheet" href="../assets/css/images.css" />
        <link rel="stylesheet" href="../assets/css/footer.css" />
        <link rel="stylesheet" href="../assets/css/estilos8.css" />

        <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

        <!-- Título de la pestaña del navegador -->
        <title>UF1304 | Imágenes</title>
    </head>

    <body>
        <header id="header"></header>
        <nav id="menu" class="principal" aria-label="Navegación principal"></nav>

        <main class="agua">
            <section>
                <header class="galeria-before portada">
                    <h2 class="pinto-mayusculas">Imágenes</h2>
                </header>

                <article class="galeria-flex">
                    <h3>Galería de imágenes</h3>
                    <p>Parrilla de imágenes con Flexbox</p>

                    <ul class="galeria">
                        <li>
                            <figure class="galeria-before diapositiva-1 hvr-bounce-out">
                                <figcaption>Foto 1</figcaption>
                            </figure>
                        </li>

                        <li>
                            <figure class="galeria-before diapositiva-2 hvr-bounce-out">
                                <figcaption>Foto 2</figcaption>
                            </figure>
                        </li>

                        <li>
                            <figure class="galeria-before diapositiva-3 hvr-bounce-out">
                                <figcaption>Foto 3</figcaption>
                            </figure>
                        </li>

                        <li>
                            <figure class="galeria-before diapositiva-4 hvr-bounce-out">
                                <figcaption>Foto 4</figcaption>
                            </figure>
                        </li>

                        <li>
                            <figure class="galeria-before diapositiva-5 hvr-bounce-out">
                                <figcaption>Foto 5</figcaption>
                            </figure>
                        </li>
                        <li>
                            <figure class="galeria-before diapositiva-1 hvr-bounce-out">
                                <figcaption>Foto 1</figcaption>
                            </figure>
                        </li>

                        <li>
                            <figure class="galeria-before diapositiva-2 hvr-bounce-out">
                                <figcaption>Foto 2</figcaption>
                            </figure>
                        </li>

                        <li>
                            <figure class="galeria-before diapositiva-3 hvr-bounce-out">
                                <figcaption>Foto 3</figcaption>
                            </figure>
                        </li>

                        <li>
                            <figure class="galeria-before diapositiva-4 hvr-bounce-out">
                                <figcaption>Foto 4</figcaption>
                            </figure>
                        </li>

                        <li>
                            <figure class="galeria-before diapositiva-5 hvr-bounce-out">
                                <figcaption>Foto 5</figcaption>
                            </figure>
                        </li>
                    </ul>
                </article>

                <article class="carrousel-container">
                    <h3>Simple Carrousel Pure CSS3</h3>
                    <p>Galería de imágenes en animación infinita automática tipo Carrousel</p>
                    <ul class="carrousel">
                        <li>
                            <figure class="galeria-before">
                                <figcaption>Color rosa <small>(#d265b5)</small></figcaption>
                            </figure>
                        </li>
                        <li>
                            <figure class="galeria-before">
                                <figcaption>Color azul <small>(#65cbd2)</small></figcaption>
                            </figure>
                        </li>
                        <li>
                            <figure class="galeria-before">
                                <figcaption>Color morado <small>(#8665d2)</small></figcaption>
                            </figure>
                        </li>
                        <li>
                            <figure class="galeria-before">
                                <figcaption>Color verde <small>(#65d27b)</small></figcaption>
                            </figure>
                        </li>
                        <li>
                            <figure class="galeria-before">
                                <figcaption>Color salmón <small>(#d28065)</small></figcaption>
                            </figure>
                        </li>
                    </ul>
                </article>
            </section>
        </main>
        <footer id="footer"></footer>
        <script type="module">
            async function includeHTML(selector, url) {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Error cargando ${url}: ${response.status}`);
                }

                document.querySelector(selector).innerHTML = await response.text();
            }

            await Promise.all([includeHTML("#header", "../layouts/header.html"), includeHTML("#menu", "../layouts/nav.html"), includeHTML("#footer", "../layouts/footer.html")]);
        </script>
    </body>
</html>
